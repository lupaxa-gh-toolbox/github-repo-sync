# =============================================================================
# Site Information
# =============================================================================

site_name: GitHub Repository Sync

site_description: >-
  Safely clone and synchronise large collections of GitHub repositories
  from a single declarative configuration.

site_author: The Lupaxa Project

site_url: https://github-repo-sync.thelupaxaproject.org/

repo_name: lupaxa-gh-toolbox/github-repo-sync
repo_url: https://github.com/lupaxa-gh-toolbox/github-repo-sync

extra:
  generator: false
  # Hide left site nav (header already lists pages); keep on-this-page TOC.
  hide_primary_sidebar: false
  repo_display_name: github-repo-sync
  # Footer (rendered by overrides/partials/copyright.html).
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  # Counter.dev analytics (omit counter_dev_id to disable).
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/the-lupaxa-project-social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true
strict: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    scheme: slate
    primary: blue
    accent: light-blue

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md

  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md

  - Configuration:
      - configuration/index.md
      - Configuration Guide: configuration/configuration-guide.md
      - Configuration Reference: configuration/configuration-reference.md
      - Examples: configuration/examples.md

  - Usage:
      - usage/index.md
      - Commands: usage/commands.md
      - Synchronisation: usage/synchronisation.md
      - Automation: usage/automation.md

  - Concepts:
      - concepts/index.md
      - Safety Model: concepts/safety-model.md
      - Repository States: concepts/repository-states.md
      - Architecture: concepts/architecture.md

  - Reference:
      - reference/index.md
      - Command Reference: reference/command-reference.md
      - Exit Codes: reference/exit-codes.md
      - Troubleshooting: reference/troubleshooting.md
      - Frequently Asked Questions: reference/faq.md

  - Development:
      - development/index.md
      - Development Environment: development/development-environment.md
      - Project Structure: development/project-structure.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
      - Release Process: development/release-process.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/header-active-nav.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html)
# =============================================================================
