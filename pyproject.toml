[build-system]
requires = [
  "setuptools>=77.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "lupaxa-github-repo-sync"
version = "0.1.0"
description = "Safely clone and update large collections of GitHub repositories from a declarative JSON5 configuration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
  "LICENSE",
]

authors = [
  { name = "The Lupaxa Project" },
]

maintainers = [
  { name = "The Lupaxa Project" },
]

keywords = [
  "automation",
  "developer-tools",
  "git",
  "github",
  "github-automation",
  "repository",
  "repository-management",
  "synchronisation",
  "synchronization",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

dependencies = [
  "GitPython>=3.1.44,<4.0.0",
  "json5>=0.12.0,<1.0.0",
  "rich>=14.0.0,<15.0.0",
]

[project.optional-dependencies]
development = [
  "build>=1.2.2,<2.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
  "twine>=6.1.0,<7.0.0",
  "types-setuptools>=80.0.0,<81.0.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/the-lupaxa-internal-toolbox/lupaxa-github-repo-sync"
Documentation = "https://github.com/the-lupaxa-internal-toolbox/lupaxa-github-repo-sync/tree/master/docs"
Repository = "https://github.com/the-lupaxa-internal-toolbox/lupaxa-github-repo-sync"
Issues = "https://github.com/the-lupaxa-internal-toolbox/lupaxa-github-repo-sync/issues"

[project.scripts]
github-repo-sync = "lupaxa.github_repo_sync.cli:main"
grs = "lupaxa.github_repo_sync.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
  "src",
]
include = [
  "lupaxa.github_repo_sync*",
]
namespaces = true

[tool.setuptools.package-data]
"lupaxa.github_repo_sync" = [
  "py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = [
  "src",
  "tests",
]
extend-exclude = [
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Core Lupaxa rule set
select = [
  # --- Essential correctness + hygiene ---
  "E",    # pycodestyle: basic style errors
  "F",    # pyflakes: unused vars, undefined names
  "I",    # import sorting
  "B",    # bugbear: common footguns

  # --- Security layer ---
  "S",    # bandit-like security checks

  # --- Modernisation + cleanup ---
  "UP",   # pyupgrade: modern Python idioms
  "SIM",  # simplify complex expressions/conditions
  "C4",   # flake8-comprehensions
  "ISC",  # implicit string-concat safety

  # --- New additions (strict mode) ---
  "D",    # pydocstyle: docstring formatting/consistency
  "ANN",  # annotations: missing/incorrect typing hints
  "PT",   # pytest: best practices for tests
]

# Disable rules that conflict with the Lupaxa documentation style
# or with Ruff's formatter.
ignore = [
  "D200",   # One-line docstring should fit on one line
  "D201",   # No blank lines allowed before function docstring
  "D202",   # No blank lines allowed after function docstring
  "D203",   # One blank line required before class docstring
  "D204",   # One blank line required after class docstring
  "D205",   # Blank line required between summary and description
  "D206",   # Docstring indentation
  "D207",   # Docstring under-indentation
  "D208",   # Docstring over-indentation
  "D209",   # Multi-line docstring closing quotes placement
  "D210",   # No surrounding whitespace allowed
  "D211",   # No blank line allowed before class docstring
  "D212",   # Summary must start on the first physical line
  "ISC001", # Conflicts with Ruff formatting
]

[tool.ruff.lint.per-file-ignores]
"src/lupaxa/github_repo_sync/validators.py" = [
  "ANN401",
]

"tests/**/*.py" = [
  "ANN",   # Test functions and fixtures may use relaxed annotations
  "D",     # Test modules do not require full public documentation
  "S101",  # Allow assert statements in tests
  "S105",  # Allow password-like test literals
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = true
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = [
  "id",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-row-type = "tuple"
parametrize-values-type = "list"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = [
  "lupaxa",
]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
]
staticmethod-decorators = [
  "staticmethod",
]

[tool.ruff.lint.pylint]
allow-dunder-method-names = []
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
files = [
  "src",
  "tests",
]
mypy_path = "src"
packages = [
  "lupaxa.github_repo_sync",
]
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_unreachable = true
warn_unused_configs = true
exclude = [
  "^build/",
  "^dist/",
]

[[tool.mypy.overrides]]
module = [
  "git.*",
  "json5",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
  "--tb=short",
]
testpaths = [
  "tests",
]
pythonpath = [
  "src",
]
xfail_strict = true
filterwarnings = [
  "error",
]

[tool.pyright]
reportMissingImports = "none"

[tool.coverage.run]
branch = true
parallel = true
source = [
  "lupaxa.github_repo_sync",
]

[tool.coverage.paths]
source = [
  "src/lupaxa/github_repo_sync",
  "*/site-packages/lupaxa/github_repo_sync",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 90
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
